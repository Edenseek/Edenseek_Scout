<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Edenseek Scout — Dashboard</title>
<style>
:root{--ground:#f5f7f9;--surface:#fff;--surface-2:#eef2f5;--ink:#151f29;--ink-soft:#33424f;--muted:#5f7080;
 --line:#dbe3ea;--line-soft:#e8edf1;--accent:#0d7d84;--accent-ink:#0a5b60;
 --pass:#1c8a5b;--warn:#a96a11;--fail:#c1372f;--info:#4a6b8a;
 --pass-bg:#e7f4ec;--warn-bg:#f8efdd;--fail-bg:#f8e6e4;--info-bg:#e9eff5;
 --shadow:0 1px 2px rgba(18,32,44,.05),0 8px 24px -18px rgba(18,32,44,.28);--radius:12px;
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root{--ground:#0d131a;--surface:#141d26;--surface-2:#1a242e;--ink:#e7eef4;
 --ink-soft:#c2cfda;--muted:#8698a8;--line:#25323d;--line-soft:#1f2b34;--accent:#31b7bd;--accent-ink:#57d0d4;
 --pass:#43b785;--warn:#d69a3f;--fail:#e8695f;--info:#7fa2c4;--pass-bg:#132a20;--warn-bg:#2c2213;--fail-bg:#2e1917;--info-bg:#172432;}}
:root[data-theme="dark"]{--ground:#0d131a;--surface:#141d26;--surface-2:#1a242e;--ink:#e7eef4;--ink-soft:#c2cfda;--muted:#8698a8;--line:#25323d;--line-soft:#1f2b34;--accent:#31b7bd;--accent-ink:#57d0d4;--pass:#43b785;--warn:#d69a3f;--fail:#e8695f;--info:#7fa2c4;--pass-bg:#132a20;--warn-bg:#2c2213;--fail-bg:#2e1917;--info-bg:#172432;}
:root[data-theme="light"]{--ground:#f5f7f9;--surface:#fff;--surface-2:#eef2f5;--ink:#151f29;--ink-soft:#33424f;--muted:#5f7080;--line:#dbe3ea;--line-soft:#e8edf1;--accent:#0d7d84;--accent-ink:#0a5b60;--pass:#1c8a5b;--warn:#a96a11;--fail:#c1372f;--info:#4a6b8a;--pass-bg:#e7f4ec;--warn-bg:#f8efdd;--fail-bg:#f8e6e4;--info-bg:#e9eff5;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
.mono,code{font-family:var(--mono)} code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;padding:11px clamp(14px,3vw,32px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:650}
.dot{width:25px;height:25px;border-radius:7px;background:radial-gradient(120% 120% at 30% 20%,var(--accent),var(--accent-ink));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tabs{display:flex;gap:4px}
.tab{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:7px 15px;cursor:pointer}
.tab .q{display:block;font-size:10px;opacity:.75;margin-top:1px}
.tab:hover{color:var(--ink)} .tab.active{color:var(--accent-ink);background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.spacer{flex:1}
.icbtn{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.icbtn:hover{color:var(--ink);border-color:var(--accent)} .icbtn.run{color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 70px}
h1{font-size:22px;margin:2px 0 3px;font-weight:650} .viewsub{color:var(--muted);margin:0 0 16px;font-size:13.5px;max-width:70ch}
h2{font-size:16px;margin:22px 0 10px}
.section-h{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink);margin:24px 0 12px;display:flex;align-items:center;gap:9px}
.section-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:13px} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;line-height:1.1}
.big.ok{color:var(--pass)} .big.warn{color:var(--warn)} .big.fail{color:var(--fail)}
.sub{color:var(--muted);font-size:12.5px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.pill.safe{color:var(--pass);background:var(--pass-bg);border-color:color-mix(in srgb,var(--pass) 30%,transparent)}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.sev{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.sev.PASS{background:var(--pass-bg);color:var(--pass)} .sev.WARNING{background:var(--warn-bg);color:var(--warn)}
.sev.FAIL{background:var(--fail-bg);color:var(--fail)} .sev.INFO{background:var(--info-bg);color:var(--info)}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.subnav button{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.subnav button.on,.subnav button:hover{color:var(--ink);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.5px} .tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid var(--line-soft);white-space:nowrap} td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
tr.boundary-row td{border-top:1.6px dashed var(--accent)}
pre.report{background:var(--surface);border:1px solid var(--line);padding:15px;border-radius:10px;overflow:auto;font-size:12px;line-height:1.45;white-space:pre-wrap;box-shadow:var(--shadow)}
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.att li{display:grid;grid-template-columns:70px 1fr;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
.att li.WARNING{border-left-color:var(--warn)} .att li.FAIL{border-left-color:var(--fail)} .att li.INFO{border-left-color:var(--info)} .att li.boundary{border-left-color:var(--accent)}
.att .txt{font-size:13px} .att .meta{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.status{color:var(--muted);margin:8px 0;font-size:13px}
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px 11px;box-shadow:var(--shadow)}
.chartcard .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px} .chartcard .title{font-size:13px;font-weight:600}
.chartcard .leg{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:11px}
.chartcard .leg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:3px}
svg .grid-l{stroke:var(--line-soft)} svg text{fill:var(--muted);font-family:var(--mono);font-size:9px} svg .bnd{stroke:var(--accent);stroke-width:1.3;stroke-dasharray:3 3}
.samples{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px}
.lever{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
.lever b{color:var(--warn)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--mono);font-size:11px}
.toggle button{background:var(--surface);border:none;color:var(--muted);padding:5px 11px;cursor:pointer} .toggle button.on{background:var(--surface-2);color:var(--ink)}
.searchbar input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.searchbar input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin:5px 0 14px} .hint code{cursor:pointer}
.info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:9px;font-family:var(--mono);cursor:help;margin-left:4px;position:relative;vertical-align:middle}
.info:hover{border-color:var(--accent);color:var(--accent-ink)}
.info .tip{display:none;position:absolute;bottom:150%;left:50%;transform:translateX(-50%);width:220px;background:var(--ink);color:var(--ground);font-family:var(--sans);font-size:11.5px;line-height:1.4;padding:9px 11px;border-radius:8px;z-index:30;box-shadow:var(--shadow);text-align:left}
.info:hover .tip{display:block}
.drawer{position:fixed;inset:0;z-index:50;display:none} .drawer.open{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(10,16,22,.45)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(450px,92vw);background:var(--ground);border-left:1px solid var(--line);padding:20px 22px;overflow-y:auto;box-shadow:var(--shadow)}
.drawer h2{margin:0 0 4px} .gl{border-top:1px solid var(--line);padding:11px 0} .gl b{display:block;font-size:13.5px;margin-bottom:3px} .gl p{margin:0;color:var(--ink-soft);font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}.tab .q{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><span class="dot"></span>Edenseek Scout</div>
  <div class="tabs">
    <button class="tab active" data-v="ops">Operations<span class="q">is Scout healthy?</span></button>
    <button class="tab" data-v="eng">Engineering<span class="q">why did it change?</span></button>
    <button class="tab" data-v="intel">Intelligence<span class="q">compare over time</span></button>
  </div>
  <span class="spacer"></span>
  <button class="icbtn" id="helpbtn">Help</button>
  <button class="icbtn" id="themebtn">Theme</button>
  <button class="icbtn run" id="run-btn" onclick="runAudit()">Run Audit</button>
</div></header>
<main>
  <div class="status" id="run-status"></div>
  <div id="view"></div>
</main>
<div class="drawer" id="help"><div class="bg"></div><div class="panel">
  <h2>Help — glossary</h2><p class="viewsub">Metric labels carry an ⓘ with the short version.</p>
  <div id="glossary"></div>
</div></div>
<script>
const GLOSSARY=[
["Precision","Of the panels the automated detector produced, the fraction that matched an approved panel (matched generated ÷ generated panels). High precision = few false panels."],
["Recall","Of the approved panels, the fraction the detector found (matched approved ÷ approved panels). Low recall = missed, merged, or under-segmented panels a human then drew."],
["High precision + low recall","The detector's panels are usually valid, but it under-segments, merges, or misses approved panels — a coverage gap, not wrong panels."],
["Split rate","Approved page panels covered by more than one automated panel."],
["Merge rate","Automated panels covering more than one approved panel."],
["False panels","Automated panels with no matching approved panel (precision gap)."],
["Missing panels","Approved page panels with no matching automated panel (recall gap)."],
["Spread-missing panels","Approved spread panels are drawn and have no automated page-space counterpart, so always counted missing."],
["Metadata accepted / unchanged rate","Fraction of comparable metadata fields the approval left byte-identical to automation."],
["Revision-distance categories","accepted → minor wording edit → moderate rewrite → major rewrite → complete replacement. Minor wording is kept distinct from a factual replacement."],
["Editorial intervention score","Weighted 0–1 measure of how much human editing metadata required (accepted 0 … replacement 1)."],
["Abstention","Scout will not compare across a declared schema/methodology boundary (e.g. generated v1.1 vs approved v1). The metric is withheld, not zeroed."],
["Comparability / methodology boundary","A point where detector, prompt, model, schema, normalization, or evaluation version changed. Metrics either side are not directly comparable; charts segment on it."],
["Severity","PASS verified good · INFO measurement · WARNING advisory (look, not a failure) · FAIL evidence/contract broken."],
["Publisher → Scout pipeline","Publisher publishes a certified revision → Scout reads evidence read-only → compares generated vs approved → persists an immutable, hash-verified report → updates index + benchmarks → this dashboard renders persisted results. Scout never writes to the Publisher."]];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=v=>v==null?"—":(v*100).toFixed(1)+"%";
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
async function getText(u){const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.text();}
function info(term){const g=GLOSSARY.find(x=>x[0].toLowerCase()===term.toLowerCase());const t=g?g[1]:term;
  return `<span class="info" tabindex="0">i<span class="tip"><b>${esc(g?g[0]:term)}</b><br>${esc(t)}</span></span>`;}
function rows(headers,data){if(!data.length)return `<p class="status">None.</p>`;
  return `<div class="tblwrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    data.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}

let view="ops",opsSub="pubhealth",archive=null,timeAxis="meas";
const el=()=>document.getElementById("view");

/* ---- archive fetch (shared) ---- */
async function loadArchive(){ if(!archive){archive=await getJSON("/audit-review/archive");} return archive; }

/* ================= OPERATIONS ================= */
async function opsView(){
  const sub=`<div class="subnav">
    ${["pubhealth","health","digest","review","readiness","failures","reports"].map(s=>
      `<button class="${opsSub===s?'on':''}" onclick="setOpsSub('${s}')">${({pubhealth:"Publisher Health",health:"Scout health",digest:"Daily Digest",review:"Review Queue",readiness:"Retrieval Readiness",failures:"Failure Analysis",reports:"Reports Index"})[s]}</button>`).join("")}</div>`;
  el().innerHTML=`<h1>Operations</h1><p class="viewsub">Is Scout healthy, what changed, and what needs a look — plus the operational dataset reports.</p>${sub}<div id="opsbody"><p class="status">Loading…</p></div>`;
  const body=document.getElementById("opsbody");
  try{ await ({pubhealth:opsPubHealth,health:opsHealth,digest:loadDigest,review:loadReview,readiness:loadReadiness,failures:loadFailures,reports:loadReports}[opsSub])(body); }
  catch(e){ body.innerHTML=`<p class="status">Could not load. ${esc(e.message)}. If no audit has run yet, click <b>Run Audit</b>.</p>`; }
}
function setOpsSub(s){opsSub=s;opsView();}

/* Publisher Health — the certified, Registry-derived D8 projections (read-only, advisory). */
async function opsPubHealth(body){
  let pub,ser,iss;
  try{ [pub,ser,iss]=await Promise.all([
    getJSON("/observability/health/publisher"), getJSON("/observability/health/series"), getJSON("/observability/health")]); }
  catch(e){ body.innerHTML=`<p class="status">Publisher Health projection unavailable: ${esc(e.message)}.</p>`; return; }
  const cls=h=>h==="attention"?"warn":(h==="unknown"?"":"ok");
  const word=h=>h==="attention"?"Attention":(h==="unknown"?"Unknown":"Healthy");
  const S=iss.summary||{}, PS=pub.summary||{};
  const overall=PS.attention>0?"attention":(PS.unknown>0?"unknown":"healthy");
  const pubCards=(pub.records||[]).map(p=>`<div class="card"><h3>Publisher · ${esc(p.publisher_id)}</h3>
    <div class="big ${cls(p.health)}">${word(p.health)}</div>
    <div class="sub">series ${p.series_counts.healthy}/${p.series_counts.total} healthy · issues ${p.issue_counts.healthy}/${p.issue_counts.total} healthy</div></div>`).join("");
  const serRows=(ser.records||[]).map(s=>[esc(s.series_id),word(s.health),`${s.issue_counts.healthy}/${s.issue_counts.total}`,esc((s.issues||[]).join(", "))]);
  const issRows=(iss.records||[]).map(i=>[esc(i.issue_id),esc(i.series_id),word(i.health),esc(i.publication_state||"—"),esc((i.reasons||[]).join(", ")||"—")]);
  const fresh=iss.registry_generated_at?`Registry as of ${esc(iss.registry_generated_at.slice(0,19).replace("T"," "))} UTC`:"";
  body.innerHTML=`
    <div class="chips"><span class="pill safe"><span class="d"></span>certified projection</span><span class="pill safe"><span class="d"></span>Registry-derived</span><span class="pill safe"><span class="d"></span>read-only · advisory</span></div>
    <div class="grid g3" style="margin-top:12px">
      <div class="card"><h3>Publisher Health ${info('Comparability / methodology boundary')}</h3>
        <div class="big ${cls(overall)}">${word(overall)}</div>
        <div class="sub">${S.healthy||0} healthy · ${S.attention||0} attention · ${S.unknown||0} unknown · ${S.total||0} issue(s)</div></div>
      ${pubCards}</div>
    <h3 style="margin-top:18px">Series</h3>${rows(["Series","Health","Issues healthy","Issue IDs"],serRows)}
    <h3 style="margin-top:18px">Issues</h3>${rows(["Issue","Series","Health","Publication state","Reasons"],issRows)}
    <p class="sub" style="margin-top:10px">${fresh} · derived from <code>/observability/health</code>, <code>/series</code>, <code>/publisher</code></p>`;
}
async function opsHealth(body){
  const a=await loadArchive(); const L=a.latest;
  if(!L){body.innerHTML=`<p class="status">No Scout synchronization report persisted yet.</p>`;return;}
  const attn=[];
  (L.finding_codes||[]).forEach(()=>{}); // marks come from counts
  const fc=L.finding_counts||{};
  a.records.filter(r=>r.record_kind==="failed_run").forEach(f=>attn.push({s:"FAIL",t:`<b>Failed run</b> at stage <code>${esc(f.failure_stage)}</code>`,m:`${esc((f.error_codes||[]).join(", "))} · ${esc(f.attempts)} attempts`}));
  a.records.filter(r=>r.record_kind==="report"&&r.methodology_boundary&&(r.methodology_boundary.geometry||r.methodology_boundary.metadata)).forEach(r=>
    attn.push({s:"boundary",t:`<b>Methodology boundary</b> at report <code>${esc(r.report_id?r.report_id.slice(-9):"")}</code>`,m:`${r.methodology_boundary.geometry?"geometry ":""}${r.methodology_boundary.metadata?"metadata":""}`}));
  if((fc.WARNING||0)>0)attn.push({s:"WARNING",t:`<b>${fc.WARNING}</b> warning finding(s) on the latest report`,m:esc(L.published_revision_id||L.issue_id||"")});
  if((fc.FAIL||0)>0)attn.push({s:"FAIL",t:`<b>${fc.FAIL}</b> failing finding(s) on the latest report`,m:""});
  body.innerHTML=`<div class="grid g3">
    <div class="card"><h3>Is Scout healthy?</h3><div class="big ${L.worst_severity==='FAIL'?'fail':(L.worst_severity==='WARNING'?'warn':'ok')}">${L.worst_severity==='FAIL'?'Attention':'Healthy'}</div>
      <div class="chips"><span class="pill safe"><span class="d"></span>read-only</span><span class="pill safe"><span class="d"></span>no publisher writes</span></div>
      <div class="sub">latest ${esc(L.published_revision_id?L.published_revision_id.slice(0,18)+'…':L.report_id)}</div></div>
    <div class="card"><h3>Latest geometry ${info('Precision')}</h3>
      <div style="display:flex;gap:20px"><div><div class="big">${pct(L.metrics.precision)}</div><div class="sub">precision</div></div>
        <div><div class="big">${pct(L.metrics.recall)}</div><div class="sub">recall ${info('Recall')}</div></div></div>
      <div class="sub" style="margin-top:9px">metadata delta: <b>${esc(L.metadata_status||'—')}</b> ${info('Abstention')}</div></div>
    <div class="card"><h3>Run ledger</h3>
      <div style="display:flex;gap:20px"><div><div class="big ok">${a.report_count}</div><div class="sub">processed</div></div>
        <div><div class="big ${a.failed_count?'fail':''}">${a.failed_count}</div><div class="sub">failed</div></div></div>
      <div class="sub" style="margin-top:9px">idempotent · retries never duplicate</div></div>
  </div>
  <div class="section-h">Requires attention (${attn.length})</div>
  <ul class="att">${attn.map(a=>`<li class="${a.s}"><span class="sev ${a.s==='boundary'?'INFO':a.s}">${a.s==='boundary'?'BND':a.s}</span><div><div class="txt">${a.t}</div><div class="meta">${a.m}</div></div></li>`).join("")||'<li class="INFO"><span class="sev INFO">OK</span><div class="txt">Nothing needs attention.</div></li>'}</ul>`;
}
/* ---- existing operational reports (dataset audit) ---- */
async function loadDigest(body){
  const d=(await getJSON("/audit/digest")).digest; const hl=d.highest_leverage_failure; const rv=d.review||{}; const rd=d.readiness||{};
  const delta=d.quality_delta==null?"":` (${d.quality_delta>=0?"+":""}${d.quality_delta})`;
  let h=`<div class="grid g4">
    <div class="card"><h3>Dataset</h3><div class="big" style="font-size:16px">${esc(d.dataset_id)}</div></div>
    <div class="card"><h3>Quality</h3><div class="big">${esc(d.quality_score)}/100${esc(delta)}</div></div>
    <div class="card"><h3>Retrieval</h3><div><span class="sev ${rd.verdict==='ready'?'PASS':rd.verdict==='not_ready'?'FAIL':'WARNING'}">${esc(rd.verdict)}</span></div><div class="sub">grounding: ${esc(rd.grounding_status)}</div></div>
    <div class="card"><h3>Trend</h3><div class="big" style="font-size:16px">${esc((d.trend||{}).confidence)}</div></div></div>
    <h2>Highest-leverage failure</h2>${hl?`<p><span class="sev WARNING">${esc(hl.estimated_impact)}</span> <b>${esc(hl.failure_type)}</b> (${esc(hl.domain)}) — ${esc(hl.affected_count)} (${esc(hl.affected_percent)}%)</p>`:`<p class="status">None.</p>`}
    <h2>Review queue (top ${(rv.top_items||[]).length})</h2>`;
  h+=rows(["Rank","Artifact","Page","Impact","Weakness"],(rv.top_items||[]).map(q=>[q.priority_rank,q.artifact_id,(typeof q.page==="number"?q.page:"unpaged"),q.estimated_impact,q.primary_weakness]));
  body.innerHTML=h;
}
async function loadReview(body){ body.innerHTML=`<h2>Review Priority Queue</h2><pre class="report">${esc(await getText("/audit/priority"))}</pre>`; }
async function loadReadiness(body){
  const rr=(await getJSON("/audit/retrieval-readiness")).retrieval_readiness;

async function loadFailures(body){

async function loadReports(body){

async function viewReport(type){

/* ================= ENGINEERING ================= */
function chart(title,series,bnds,legend,metaArr){
  const W=520,H=150,PL=30,PR=12,PT=12,PB=20,iw=W-PL-PR,ih=H-PT-PB,n=series[0].pts.length;
  const x=i=>PL+(n<=1?iw/2:iw*i/(n-1)),y=v=>PT+ih*(1-v);
  let g="";for(let t=0;t<=4;t++){const yy=PT+ih*t/4;g+=`<line class="grid-l" x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}"/><text x="${PL-6}" y="${yy+3}" text-anchor="end">${100-t*25}</text>`;}
  let b="";bnds.forEach(bi=>{const xx=x(bi);b+=`<line class="bnd" x1="${xx}" y1="${PT}" x2="${xx}" y2="${PT+ih}"/><text x="${xx}" y="${PT-3}" text-anchor="middle" fill="var(--accent-ink)">method →</text>`;});
  let L="";series.forEach(s=>{let segs=[[]];s.pts.forEach((v,i)=>{if(bnds.includes(i)&&i>0)segs.push([]);if(v!=null)segs[segs.length-1].push([x(i),y(v)]);});
    segs.forEach(seg=>{if(seg.length)L+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${seg.map(p=>p.join(",")).join(" ")}"/>`;});
    s.pts.forEach((v,i)=>{if(v!=null)L+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.color}"><title>${esc(s.name)} ${(v*100).toFixed(1)}% · ${esc(metaArr[i]||"")}</title></circle>`;});});
  return `<div class="chartcard"><div class="head"><span class="title">${title}</span><span class="leg">${legend.map(l=>`<span><i style="background:${l.c}"></i>${l.n}</span>`).join("")}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%">${g}${b}${L}</svg><div class="samples">n/point: ${metaArr.join(" · ")}</div></div>`;
}
/* ---- geometry per-page diagnostics (from the latest delta report's geometry_delta.diagnostics) ---- */
let latestDiag=undefined;
async function loadLatestDiag(){
  if(latestDiag!==undefined)return latestDiag;
  try{const rep=await getJSON("/reports/latest");latestDiag=((rep||{}).geometry_delta||{}).diagnostics||null;}
  catch(e){latestDiag=null;}
  return latestDiag;
}
function geomScatter(pp,W,H){
  const pad={l:32,r:12,t:10,b:30},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,maxD=Math.max(6,...pp.map(p=>p.density||0));
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
  for(let yv=0;yv<=1.0001;yv+=.25){const py=pad.t+ih-ih*yv;g+=`<line class="grid-l" x1="${pad.l}" y1="${py}" x2="${W-pad.r}" y2="${py}"/><text x="${pad.l-6}" y="${py+3}" text-anchor="end">${(yv*100)|0}</text>`;}
  for(let xv=1;xv<=maxD;xv++){const px=pad.l+iw*(xv/maxD);g+=`<text x="${px}" y="${H-11}" text-anchor="middle">${xv}</text>`;}
  g+=`<text x="${pad.l+iw/2}" y="${H-1}" text-anchor="middle">panels per page</text>`;
  const seen={};
  pp.forEach(p=>{const k=(p.density||0)+","+Math.round((p.segmentation_accuracy||0)*100);seen[k]=(seen[k]||0)+1;const j=(seen[k]-1)*5;
    const px=pad.l+iw*((p.density||0)/maxD)+j,py=pad.t+ih-ih*(p.segmentation_accuracy||0);
    g+=`<circle cx="${px}" cy="${py}" r="5" fill="${p.generated_panels>0?'var(--pass)':'var(--fail)'}" fill-opacity=".82" stroke="var(--surface)" stroke-width="1"><title>page ${p.page_number} · ${p.density} panels · recall ${((p.recall||0)*100)|0}% · accuracy ${((p.segmentation_accuracy||0)*100).toFixed(0)}% · missing ${p.missing}</title></circle>`;});
  return g+`<line class="grid-l" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ih}"/></svg>`;
}
function geomLever(diag){
  const pp=diag.per_page||[],sk=pp.filter(p=>p.generated_panels===0),pr=pp.filter(p=>p.generated_panels>0);
  const rec=pr.length?pr.reduce((s,p)=>s+(p.recall||0),0)/pr.length:0,oa=((diag.order||{}).agreement||0)*100;
  return `Automation produced <b>no panels on ${sk.length} of ${pp.length} pages</b>; on the ${pr.length} it processed, recall ≈ ${(rec*100).toFixed(0)}% and reading order is ${oa.toFixed(0)}% correct. Biggest lever: page-level detection coverage.`;
}
function scatterNote(){return `<div class="samples"><span style="color:var(--pass)">●</span> processed &nbsp; <span style="color:var(--fail)">●</span> skipped (0 panels) &nbsp;·&nbsp; x = panels/page, y = segmentation accuracy</div>`;}
function renderGeomDiag(diag){
  const gd=document.getElementById("geomdiag"); if(!gd)return;
  if(!diag||!(diag.per_page||[]).length){gd.innerHTML=`<p class="status">Per-page geometry diagnostics appear once a v2 audit has run.</p>`;return;}
  const sz=diag.panel_size_recall||{};
  const bars=["large","medium","small"].map(k=>{const s=sz[k]||{},w=(s.recall||0)*100;
    return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${k} <span class="samples" style="display:inline">(${s.approved_panels||0})</span></span><span>${s.approved_panels?w.toFixed(0)+'%':'—'}</span></div><div style="height:9px;border-radius:5px;background:var(--surface-2)"><i style="display:block;height:100%;width:${w}%;background:var(--accent);border-radius:5px"></i></div></div>`;}).join("");
  const o=diag.order||{},oa=((o.agreement||0)*100).toFixed(1);
  let tbl=`<div class="tblwrap"><table><thead><tr><th>page</th><th class="n">panels</th><th class="n">gen</th><th class="n">recall</th><th class="n">accuracy</th><th class="n">missing</th></tr></thead><tbody>`;
  (diag.per_page||[]).slice().sort((x,y)=>(""+x.page_number).localeCompare(""+y.page_number,undefined,{numeric:true})).forEach(p=>{
    tbl+=`<tr><td>${esc(p.page_number)}</td><td class="n">${p.density}</td><td class="n" style="color:${p.generated_panels?'':'var(--fail)'}">${p.generated_panels}</td><td class="n">${((p.recall||0)*100)|0}%</td><td class="n">${((p.segmentation_accuracy||0)*100).toFixed(0)}%</td><td class="n">${p.missing||''}</td></tr>`;});
  gd.innerHTML=`<div class="lever">${geomLever(diag)}</div>
    <div class="grid g2"><div class="chartcard"><div class="head"><span class="title">Accuracy by page complexity <span class="samples">· ${diag.per_page.length} pages</span></span></div>${geomScatter(diag.per_page,460,210)}${scatterNote()}</div>
    <div class="card"><h3>Reading-order fidelity</h3><div class="big ok">${oa}%</div><div class="sub">${o.concordant||0} concordant / ${o.discordant||0} discordant pairs</div><div class="section-h" style="margin:14px 0 6px">Recall by panel size</div>${bars}</div></div>
    ${tbl}</tbody></table></div>`;
}

async function engView(){
  el().innerHTML=`<h1>Engineering</h1><p class="viewsub">Why a benchmark moved, which reports demonstrate it, and how geometry &amp; metadata quality evolved. Lines never cross a methodology boundary.</p><div id="engbody"><p class="status">Loading…</p></div>`;
  const body=document.getElementById("engbody");
  try{
    const a=await loadArchive();
    const reps=a.records.filter(r=>r.record_kind==="report").slice().sort((x,y)=>((timeAxis==='event'?(x.event_time||""):(x.measurement_time||x.completed_at||"")).localeCompare(timeAxis==='event'?(y.event_time||""):(y.measurement_time||y.completed_at||"")))||((x.run_seq||0)-(y.run_seq||0)));
    if(!reps.length){body.innerHTML=`<p class="status">No persisted reports yet. Run the synchronization audit to populate trends.</p>`;return;}
    const bnds=[];reps.forEach((r,i)=>{if(i>0&&reps[i-1].geometry_comparability_key!==r.geometry_comparability_key)bnds.push(i);});
    const mbnds=[];reps.forEach((r,i)=>{if(i>0&&reps[i-1].metadata_comparability_key!==r.metadata_comparability_key)mbnds.push(i);});
    const meta=reps.map(r=>"run"+String(r.run_seq).padStart(3,"0"));
    const gs=[{name:"precision",color:"var(--accent)",pts:reps.map(r=>r.metrics.precision??null)},{name:"recall",color:"var(--info)",pts:reps.map(r=>r.metrics.recall??null)}];
    const ms=[{name:"accepted",color:"var(--pass)",pts:reps.map(r=>r.metrics.unchanged_metadata_rate??null)}];
    const toggle=`<span class="toggle" style="margin-left:auto"><button class="${timeAxis==='meas'?'on':''}" onclick="setAxis('meas')">measurement time</button><button class="${timeAxis==='event'?'on':''}" onclick="setAxis('event')">publication time</button></span>`;
    let h=`<div class="section-h">How has quality evolved? ${toggle}</div><div class="grid g2">
      ${chart('Geometry — precision '+info('Precision')+' &amp; recall '+info('Recall'),gs,bnds,[{n:"precision",c:"var(--accent)"},{n:"recall",c:"var(--info)"}],meta)}
      ${chart('Metadata — accepted '+info('Metadata accepted / unchanged rate'),ms,mbnds,[{n:"accepted",c:"var(--pass)"}],meta)}</div>`;
    const diag=await loadLatestDiag();
    if(diag&&(diag.per_page||[]).length){
      h+=`<div class="section-h">Where does segmentation struggle?</div>
        <div class="lever">${geomLever(diag)}</div>
        <div class="chartcard"><div class="head"><span class="title">Segmentation accuracy by page complexity <span class="samples">· ${diag.per_page.length} pages</span></span></div>${geomScatter(diag.per_page,540,220)}${scatterNote()}</div>`;
    }
    h+=`<div class="section-h">Which reports demonstrate the change?</div><div class="tblwrap"><table><thead><tr><th>report</th><th>issue</th><th>precision</th><th>recall</th><th>metadata</th><th>worst</th><th>sha256</th></tr></thead><tbody>`;
    a.records.filter(r=>r.record_kind==="report").forEach((r,i,arr)=>{const brk=i>0&&arr[i-1].geometry_comparability_key!==r.geometry_comparability_key;
      h+=`<tr class="${brk?'boundary-row':''}"><td><code>${esc(r.report_id?r.report_id.slice(-9):"")}</code></td><td>${esc(r.issue_id)}</td><td class="n">${pct(r.metrics.precision)}</td><td class="n">${pct(r.metrics.recall)}</td><td>${esc(r.metadata_status||"—")}</td><td><span class="sev ${r.worst_severity}">${esc(r.worst_severity)}</span></td><td class="mono" style="font-size:11px">${esc((r.report_sha256||"").slice(0,10))}</td></tr>`;});
    body.innerHTML=h+`</tbody></table></div>`;
  }catch(e){ body.innerHTML=`<p class="status">Could not load benchmarks (${esc(e.message)}).</p>`; }
}
function setAxis(a){timeAxis=a;engView();}

/* ================= INTELLIGENCE ================= */
async function intelView(){
  el().innerHTML=`<h1>Intelligence</h1><p class="viewsub">Compare publishers, series, issues, and methodology versions over time; surface benchmark history and methodology boundaries. Search runs server-side.</p>
    <div class="searchbar"><input id="q" placeholder="precision<0.90  metadata_unchanged_rate>=0.60  finding:geometry.false_panels  issue:issue_001  severity:WARNING" oninput="runSearch()"/></div>
    <div class="hint">try: <code onclick="setQ('precision<0.95')">precision&lt;0.95</code> <code onclick="setQ('severity:WARNING')">severity:WARNING</code> <code onclick="setQ('finding:geometry.false_panels')">finding:geometry.false_panels</code> <code onclick="setQ('kind:failed_run')">kind:failed_run</code></div>
    <div class="section-h">Geometry diagnostics</div><div id="geomdiag"><p class="status">Loading…</p></div>
    <div class="section-h">Compare over time</div><div id="cmp"><p class="status">Loading…</p></div>
    <div class="section-h">Methodology boundaries</div><ul class="att" id="bndlist"></ul>`;
  try{
    const a=await loadArchive();
    renderGeomDiag(await loadLatestDiag());
    document.getElementById("cmp").innerHTML=cmpTable(a.records.filter(r=>r.record_kind==="report"));
    const items=[]; a.records.filter(r=>r.record_kind==="report"&&r.methodology_boundary).forEach(r=>{
      if(r.methodology_boundary.geometry)items.push(`<li class="boundary"><span class="sev INFO">BND</span><div><div class="txt"><b>Geometry methodology changed</b></div><div class="meta">at ${esc(r.report_id?r.report_id.slice(-9):"")} · key ${esc(r.geometry_comparability_key)}</div></div></li>`);
      if(r.methodology_boundary.metadata)items.push(`<li class="boundary"><span class="sev INFO">BND</span><div><div class="txt"><b>Metadata methodology changed</b></div><div class="meta">at ${esc(r.report_id?r.report_id.slice(-9):"")} · key ${esc(r.metadata_comparability_key)}</div></div></li>`);});
    document.getElementById("bndlist").innerHTML=items.join("")||'<li class="INFO"><span class="sev INFO">—</span><div class="txt">No methodology changes in this window.</div></li>';
  }catch(e){ document.getElementById("cmp").innerHTML=`<p class="status">Could not load (${esc(e.message)}).</p>`; }
}
function cmpTable(reps){
  if(!reps.length)return `<p class="status">No reports yet.</p>`;
  let h=`<div class="tblwrap"><table><thead><tr><th>report</th><th>issue</th><th>event</th><th>measured</th><th>schema</th><th>algo</th><th>precision</th><th>recall</th><th>accepted</th><th>worst</th></tr></thead><tbody>`;
  reps.forEach((r,i,arr)=>{const brk=i>0&&(arr[i-1].geometry_comparability_key!==r.geometry_comparability_key||arr[i-1].metadata_comparability_key!==r.metadata_comparability_key);
    h+=`<tr class="${brk?'boundary-row':''}"><td><code>${esc(r.report_id?r.report_id.slice(-9):"")}</code></td><td>${esc(r.issue_id)}</td><td class="mono">${esc((r.event_time||"—").slice(0,10))}</td><td class="mono">${esc((r.measurement_time||r.completed_at||"—").slice(0,10))}</td><td class="mono">${esc(r.schema_version||"—")}</td><td class="mono">${esc(r.algorithm_version||"—")}</td><td class="n">${pct(r.metrics.precision)}</td><td class="n">${pct(r.metrics.recall)}</td><td class="n">${pct(r.metrics.unchanged_metadata_rate)}</td><td><span class="sev ${r.worst_severity}">${esc(r.worst_severity)}</span></td></tr>`;});
  return h+`</tbody></table></div>`;
}
async function runSearch(){
  const q=document.getElementById("q").value;
  try{ const r=await getJSON("/audit-review/search?q="+encodeURIComponent(q));
    document.getElementById("cmp").innerHTML=cmpTable(r.records.filter(x=>x.record_kind==="report"))+`<div class="samples">${r.count} match(es) · filtered server-side</div>`;
  }catch(e){ document.getElementById("cmp").innerHTML=`<p class="status">Search failed (${esc(e.message)}).</p>`; }
}
function setQ(v){document.getElementById("q").value=v;runSearch();}

/* ================= SHELL ================= */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===view));
  if(view==="ops")opsView(); else if(view==="eng")engView(); else intelView();
}
function setView(v){view=v;render();}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setView(t.dataset.v)));
document.getElementById("glossary").innerHTML=GLOSSARY.map(g=>`<div class="gl"><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div>`).join("");
const dr=document.getElementById("help");
document.getElementById("helpbtn").onclick=()=>dr.classList.add("open");
dr.querySelector(".bg").onclick=()=>dr.classList.remove("open");
document.getElementById("themebtn").onclick=()=>{const r=document.documentElement;const c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");r.setAttribute("data-theme",c==="dark"?"light":"dark");};
async function runAudit(){
  const btn=document.getElementById("run-btn"),st=document.getElementById("run-status");
  btn.disabled=true;st.textContent="Running dataset audit…";
  try{const r=await fetch("/run-audit",{method:"POST"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();
    st.textContent=`Dataset audit complete: quality ${d.quality_score}/100.`; archive=null; render();
  }catch(e){ st.textContent="Audit failed. Check logs/scout.log."; } finally{ btn.disabled=false; }
}
render();
</script>
